name: E2E Critical Flows

# Only the critical MVP flows (auth + orders), and only where a regression is expensive:
# PRs targeting main, plus manual runs. NOT on every push — Playwright + a real Postgres
# round-trip is too costly to run on every branch push.
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: e2e-critical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-critical:
    name: Playwright · auth + orders
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # playwright.config.ts's webServer runs `npm run dev` itself (reuseExistingServer is
    # disabled when CI is set), against this real E2E database. The seed data required for
    # orders.spec.ts (the E2E_USER_EMAIL/PASSWORD account plus at least one store) must already
    # exist in E2E_DATABASE_URL — see docs/development/testing.md for the manual setup this
    # secret set still requires from the owner.
    env:
      CI: "true"
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.E2E_BETTER_AUTH_SECRET }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Read from `.nvmrc` so CI and the machine the code is validated on cannot drift apart.
          # They did: CI pinned Node 20 (npm 10) while development runs Node 24 (npm 11), and the
          # two npm majors disagree about one nested dependency, so every `npm install` locally
          # produced a lockfile `npm ci` here refused ("Missing: @swc/helpers@0.5.23 from lock
          # file"). This job had been red on every push to main for months because of it.
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run critical E2E specs
        run: npx playwright test e2e/auth.spec.ts e2e/orders.spec.ts

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
